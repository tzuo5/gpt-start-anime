name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install system runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-gi gir1.2-gtk-3.0 gir1.2-gstreamer-1.0 \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-libav \
            desktop-file-utils xvfb xauth
      - name: Unit and integration tests
        run: /usr/bin/python3 -m unittest discover -s tests -v
      - name: Construct and display the appearance settings window
        run: |
          xvfb-run -a /usr/bin/python3 - <<'PY'
          import gi
          gi.require_version('Gtk', '3.0')
          from gi.repository import Gtk, GLib
          import manage
          GLib.timeout_add(500, lambda: Gtk.main_quit() or False)
          manage.gui()
          print('Appearance settings window displayed successfully')
          PY
      - name: Decode, render, and finish the bundled MP4
        run: |
          xvfb-run -a /usr/bin/python3 player.py --video animations/00-default.mp4 --mute --report playback.json
          /usr/bin/python3 - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('playback.json').read_text())
          assert result['reason'] == 'eos', result
          assert result['frames'] > 0, result
          print(result)
          PY
